[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hylofrac"
version = "0.1.0"
description = "HyloFrac: physical bone fracture dataset and benchmark for 3D reassembly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HyloFrac authors" }]
keywords = ["3d-reassembly", "fracture", "benchmark", "point-cloud"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "open3d>=0.17",
]

[project.optional-dependencies]
ml = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
hylofrac-export = "hylofrac.dataset.export:main"
hylofrac-annotate = "hylofrac.dataset.annotate:main"
hylofrac-split = "hylofrac.dataset.split:main"
hylofrac-qc = "hylofrac.dataset.qc:main"
hylofrac-evaluate = "hylofrac.eval.evaluate:main"
hylofrac-train = "hylofrac.baselines.train:main"
hylofrac-predict = "hylofrac.baselines.predict:main"
hylofrac-visualize = "hylofrac.vis.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
